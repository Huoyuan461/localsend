name: build_ios_ipa
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Setup Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - run: gem install cocoapods -N

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 -d -o /tmp/dist.p12
          security create-keychain -p ci /tmp/ci.keychain-db
          security set-keychain-settings -t 3600 -u /tmp/ci.keychain-db
          security unlock-keychain -p ci /tmp/ci.keychain-db
          security import /tmp/dist.p12 -k /tmp/ci.keychain-db -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci /tmp/ci.keychain-db
          security list-keychains -d user -s /tmp/ci.keychain-db $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profiles
        env:
          PROF_APP: ${{ secrets.IOS_PROFILE_APP }}
          PROF_EXT: ${{ secrets.IOS_PROFILE_EXT }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROF_APP" | base64 -d -o ~/Library/MobileDevice/Provisioning\ Profiles/Zhichuan_AppStore.mobileprovision
          echo "$PROF_EXT" | base64 -d -o ~/Library/MobileDevice/Provisioning\ Profiles/Zhichuan_ShareExtension_AppStore.mobileprovision

      - name: Flutter pub get & pod install
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Build IPA
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>49Y2P4VXPB</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.zhichuan.app</key><string>Zhichuan AppStore</string>
                  <key>com.zhichuan.app.ShareExtension</key><string>Zhichuan ShareExtension AppStore</string>
              </dict>
              <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zhichuan-ios-ipa
          path: build/ios/ipa/*.ipa
