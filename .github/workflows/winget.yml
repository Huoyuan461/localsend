name: Publish to WinGet
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to publish to WinGet
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Zhichuan
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Zhichuan.Zhichuan
          installers-regex: '^Zhichuan-[0-9]+\.[0-9]+\.[0-9]+-windows-x86-64\.exe$'
          release-tag: ${{ inputs.release_tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish Zhichuan CLI
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Zhichuan.Zhichuan.CLI
          installers-regex: 'Zhichuan-CLI-.*\.exe$'
          release-tag: ${{ inputs.release_tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
